name: finance-tracker

services:
  postgres:
    image: docker.io/library/postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?a .env nincs kitöltve}
      FINANCE_OWNER_PASSWORD: ${FINANCE_OWNER_PASSWORD:?}
      APP_WRITER_PASSWORD: ${APP_WRITER_PASSWORD:?}
      DBT_RUNNER_PASSWORD: ${DBT_RUNNER_PASSWORD:?}
      REPORT_READER_PASSWORD: ${REPORT_READER_PASSWORD:?}
    volumes:
      # A Postgres 18-as kép a PGDATA-t ez alatt, verziózott mappában tartja.
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql:z
      - ./postgres/init:/docker-entrypoint-initdb.d:ro,z
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    healthcheck:
      # TCP-n kérdezünk: az init scriptek alatt a szerver csak unix socketen figyel.
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, postgres, -d, finance]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  migrate:
    image: ghcr.io/amacneil/dbmate:2.37.0
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://finance_owner:${FINANCE_OWNER_PASSWORD:?}@postgres:5432/finance?sslmode=disable
    volumes:
      - ../migrations:/migrations:ro,z
    command: [--migrations-dir, /migrations, --no-dump-schema, up]

  garage:
    image: docker.io/dxflrs/garage:v2.5.0
    restart: unless-stopped
    # Egycsomópontos layout, a raw bucket és a kulcs az első induláskor jön létre.
    command: [/garage, server, --single-node, --default-bucket]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?}
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_ACCESS_KEY:?}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_SECRET_KEY:?}
      GARAGE_DEFAULT_BUCKET: raw
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro,z
      - ${DATA_DIR:-./data}/garage/meta:/var/lib/garage/meta:z
      - ${DATA_DIR:-./data}/garage/data:/var/lib/garage/data:z
    ports:
      # Csak az S3 API; az RPC és az admin port a Compose-hálózaton belül marad.
      - ${BIND_ADDRESS:-127.0.0.1}:${GARAGE_S3_PORT:-3900}:3900
    healthcheck:
      test: [CMD, /garage, status]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Csak a goldot olvassa, a beállításai a reports/.streamlit mappában vannak.
  reports:
    build: ../reports
    image: localhost/finance-tracker-reports
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://report_reader:${REPORT_READER_PASSWORD:?}@postgres:5432/finance
      WEBAPP_URL: http://${BIND_ADDRESS:-127.0.0.1}:${WEBAPP_PORT:-8000}
      STREAMLIT_BROWSER_SERVER_ADDRESS: ${BIND_ADDRESS:-localhost}
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${REPORTS_PORT:-8501}:8501
    healthcheck:
      test: [CMD, python, -c, "import urllib.request as u; u.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s

  # A mappa a gazdagép felhasználójáé, a webapp viszont nobody-ként fut.
  inbox-init:
    image: docker.io/library/python:3.13.18-slim
    restart: "no"
    user: "0"
    volumes:
      - ${DATA_DIR:-./data}/inbox:/inbox:z
    command: [chown, "65534:65534", /inbox]

  # Egyelőre itt fut, a Pi-re költözéssel átkerül a pi/ Compose-fájlba (ADR 0005).
  webapp:
    build: ../webapp
    image: localhost/finance-tracker-webapp
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      inbox-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://app_writer:${APP_WRITER_PASSWORD:?}@postgres:5432/finance
      HOUSEHOLD_MEMBERS: ${HOUSEHOLD_MEMBERS:-person_a,person_b}
      INBOX_DIR: /inbox
      WORKER_API_TOKEN: ${WORKER_API_TOKEN:?}
      REPORTS_URL: http://${BIND_ADDRESS:-127.0.0.1}:${REPORTS_PORT:-8501}
    volumes:
      - ${DATA_DIR:-./data}/inbox:/inbox:z
    ports:
      # Belépés a FIN-303-ig nincs, ezért csak helyben látszhat.
      - 127.0.0.1:${WEBAPP_PORT:-8000}:8000
    healthcheck:
      test: [CMD, python, -c, "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Modellek a data/ollama alatt; portja nincs, csak a worker éri el a Compose-hálózaton.
  ollama:
    image: docker.io/ollama/ollama:0.40.13
    restart: unless-stopped
    volumes:
      - ${DATA_DIR:-./data}/ollama:/root/.ollama:z
    healthcheck:
      test: [CMD, ollama, list]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 10s

  worker:
    build: ../worker
    image: localhost/finance-tracker-worker
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      garage:
        condition: service_healthy
      webapp:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://app_writer:${APP_WRITER_PASSWORD:?}@postgres:5432/finance
      INBOX_URL: http://webapp:8000
      WORKER_API_TOKEN: ${WORKER_API_TOKEN:?}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-60}
      GARAGE_ENDPOINT: http://garage:3900
      GARAGE_ACCESS_KEY: ${GARAGE_ACCESS_KEY:?}
      GARAGE_SECRET_KEY: ${GARAGE_SECRET_KEY:?}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-glm-ocr}
      OLLAMA_NUM_THREAD: ${OLLAMA_NUM_THREAD:-10}
    healthcheck:
      # A jelentő szál frissíti a fájlt; a főszál a modellnél percekig is állhat.
      test: [CMD, python, -c, "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/worker-heartbeat') > 60)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  webapp-test:
    image: docker.io/library/python:3.13.18-slim
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgresql://app_writer:${APP_WRITER_PASSWORD:?}@postgres:5432/finance
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_ROOT_USER_ACTION: ignore
    working_dir: /repo/webapp
    volumes:
      - ..:/repo:ro,z
    entrypoint: [sh, -c, "pip install -q --no-cache-dir -r requirements-dev.txt && python -m pytest -q -p no:cacheprovider"]

  reports-test:
    image: docker.io/library/python:3.13.18-slim
    profiles: [tools]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /repo/reports
      PIP_ROOT_USER_ACTION: ignore
    working_dir: /repo/reports
    volumes:
      - ..:/repo:ro,z
    entrypoint: [sh, -c, "pip install -q --no-cache-dir -r requirements-dev.txt && python -m pytest -q -p no:cacheprovider"]

  # A valódi Garage-ba és Postgresbe ír, a modellt egy csonk helyettesíti.
  worker-test:
    image: docker.io/library/python:3.13.18-slim
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgresql://app_writer:${APP_WRITER_PASSWORD:?}@postgres:5432/finance
      TEST_GARAGE_ENDPOINT: http://garage:3900
      GARAGE_ACCESS_KEY: ${GARAGE_ACCESS_KEY:?}
      GARAGE_SECRET_KEY: ${GARAGE_SECRET_KEY:?}
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_ROOT_USER_ACTION: ignore
    working_dir: /repo/worker
    volumes:
      - ..:/repo:ro,z
    entrypoint: [sh, -c, "pip install -q --no-cache-dir -r requirements-dev.txt && python -m pytest -q -p no:cacheprovider"]

  # Csak olvassa a dbt mappát, a futás melléktermékei a konténerben maradnak.
  dbt:
    build: ../dbt
    image: localhost/finance-tracker-dbt:1.12.6
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DBT_RUNNER_PASSWORD: ${DBT_RUNNER_PASSWORD:?}
      DBT_PROFILES_DIR: /dbt
      DBT_TARGET_PATH: /tmp/dbt/target
      DBT_LOG_PATH: /tmp/dbt/logs
      DBT_PACKAGES_INSTALL_PATH: /tmp/dbt/packages
    volumes:
      - ../dbt:/dbt:ro,z

  # Eszközök a mentéshez: csak a scripts/ mappából, `run`-nal indulnak.
  rclone:
    image: docker.io/rclone/rclone:1.75.2
    profiles: [tools]
    environment:
      RCLONE_CONFIG_GARAGE_TYPE: s3
      RCLONE_CONFIG_GARAGE_PROVIDER: Other
      RCLONE_CONFIG_GARAGE_ENDPOINT: http://garage:3900
      RCLONE_CONFIG_GARAGE_REGION: garage
      RCLONE_CONFIG_GARAGE_FORCE_PATH_STYLE: "true"
      RCLONE_CONFIG_GARAGE_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY:?}
      RCLONE_CONFIG_GARAGE_SECRET_ACCESS_KEY: ${GARAGE_SECRET_KEY:?}
    volumes:
      - ${BACKUP_DIR:-./backup}:/backup:z

  restic:
    image: docker.io/restic/restic:0.19.1
    profiles: [tools]
    hostname: finance-home
    environment:
      RESTIC_REPOSITORY: /repo
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?}
    volumes:
      - ${RESTIC_REPO_DIR:-./backup/restic}:/repo:z
      - ${BACKUP_DIR:-./backup}:/backup:z

  # A visszaállítási próba eldobható adatbázisa: memóriában fut, nincs portja.
  restore-db:
    image: docker.io/library/postgres:18.6
    profiles: [tools]
    environment:
      POSTGRES_PASSWORD: restore-test-only
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ${BACKUP_DIR:-./backup}:/backup:ro,z
