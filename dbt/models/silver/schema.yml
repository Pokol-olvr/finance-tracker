        format: sql
        rows: |
          select '00000000-0000-0000-0000-000000000001'::uuid as group_id, '2026-10-14'::date as occurred_on, 'person_a'::text as purchased_by, 'shared'::text as payer, 'person_a'::text as uploaded_by, 'Kitalált Kft.'::text as store_name
      - input: ref('receipt_items')
        rows:
          - {group_id: 00000000-0000-0000-0000-000000000001, kind: item, value: 599, category: élelmiszer}
          - {group_id: 00000000-0000-0000-0000-000000000001, kind: discount, value: -99, category: élelmiszer}
          - {group_id: 00000000-0000-0000-0000-000000000001, kind: item, value: 300, category: besorolatlan}
          - {group_id: 00000000-0000-0000-0000-000000000001, kind: deposit, value: 50, category: null}
          - {group_id: 00000000-0000-0000-0000-000000000001, kind: voucher, value: -300, category: null}
    expect:
      rows:
        - {source: manual, amount: 1000, category: lakbér, kind: expense}
        - {source: document, amount: "500.00", category: élelmiszer, kind: expense}
        - {source: document, amount: "300.00", category: besorolatlan, kind: expense}

