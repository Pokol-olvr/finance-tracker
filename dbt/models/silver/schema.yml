          - {id: 40000000-0000-0000-0000-000000000003, rule_id: 30000000-0000-0000-0000-000000000002, rule_type: category, pattern: sonka, target_value: élelmiszer, active: true, created_at: 2026-10-01 10:00:00+00}
    expect:
      rows:
        - {rule_id: 30000000-0000-0000-0000-000000000002, pattern: SONKA, target: élelmiszer}
