version: 2

models:
  - name: monthly_cash_flow
    description: Havi bevétel, kiadás és egyenleg fizető felenként; az átvezetés nem számít bele.
    columns:
      - name: month
        data_tests: [not_null]
      - name: payer
        data_tests: [not_null]
  - name: expense_documents
    description: A kiadásba számított dokumentumok a Kiadások riporthoz.
    columns:
      - name: group_id
        data_tests: [unique, not_null]
  - name: expense_items
    description: A beszámított dokumentumok tételei a Kiadások riporthoz.
    columns:
      - name: group_id
        data_tests: [not_null]
      - name: value
        data_tests: [not_null]
  - name: document_states
    description: Dokumentumok száma állapotonként.
    columns:
      - name: state
        data_tests: [unique, not_null]
  - name: deposit_history
    description: A betétdíj mozgásai és az egyenleg utánuk.
    columns:
      - name: balance
        data_tests: [not_null]
  - name: expected_deposit
    description: A várható betétdíj jelenlegi összege, egy sor.
    columns:
      - name: balance
        data_tests: [not_null]
  - name: category_month
    description: Havi kiadás kategóriánként és fizető felenként.
    columns:
      - name: month
        data_tests: [not_null]
      - name: category
        data_tests: [not_null]

unit_tests:
  # A számok kitaláltak, a Sprint 2 mintahónapjai.
  - name: monthly_cash_flow_mintahonapok
    model: monthly_cash_flow
    overrides:
      vars:
        as_of_date: "date '2026-11-15'"
    given:
      - input: ref('transactions')
        rows:
          - {kind: income, amount: 500000, occurred_on: 2026-09-05, payer: shared}
          - {kind: expense, amount: 320000, occurred_on: 2026-09-12, payer: shared}
          - {kind: transfer, amount: 100000, occurred_on: 2026-09-20, payer: shared}
          - {kind: income, amount: 500000, occurred_on: 2026-10-05, payer: shared}
          - {kind: expense, amount: 450000, occurred_on: 2026-10-12, payer: shared}
          - {kind: expense, amount: 120000, occurred_on: 2026-11-03, payer: shared}
    expect:
      rows:
        - {month: 2026-09-01, payer: shared, income: 500000, expense: 320000, net: 180000, savings_rate: 0.36}
        - {month: 2026-10-01, payer: shared, income: 500000, expense: 450000, net: 50000, savings_rate: 0.10}
        - {month: 2026-11-01, payer: shared, income: 0, expense: 120000, net: -120000, savings_rate: null}

  - name: monthly_cash_flow_ures_honap_es_fizeto_felek
    model: monthly_cash_flow
    overrides:
      vars:
        as_of_date: "date '2026-11-15'"
    given:
      - input: ref('transactions')
        rows:
          - {kind: income, amount: 1000, occurred_on: 2026-09-05, payer: person_a}
          - {kind: expense, amount: 400, occurred_on: 2026-11-03, payer: shared}
    expect:
      rows:
        - {month: 2026-09-01, payer: person_a, income: 1000, expense: 0, net: 1000, savings_rate: 1}
        - {month: 2026-09-01, payer: shared, income: 0, expense: 0, net: 0, savings_rate: null}
        - {month: 2026-10-01, payer: person_a, income: 0, expense: 0, net: 0, savings_rate: null}
        - {month: 2026-10-01, payer: shared, income: 0, expense: 0, net: 0, savings_rate: null}
        - {month: 2026-11-01, payer: person_a, income: 0, expense: 0, net: 0, savings_rate: null}
        - {month: 2026-11-01, payer: shared, income: 0, expense: 400, net: -400, savings_rate: null}

  - name: category_month_atvezetes_nelkul
    model: category_month
    given:
      - input: ref('transactions')
        rows:
          - {kind: expense, amount: 300, occurred_on: 2026-09-05, payer: shared, category: élelmiszer}
          - {kind: expense, amount: 200, occurred_on: 2026-09-15, payer: shared, category: élelmiszer}
          - {kind: expense, amount: 700, occurred_on: 2026-09-20, payer: shared, category: lakbér}
          - {kind: transfer, amount: 900, occurred_on: 2026-09-21, payer: shared, category: null}
          - {kind: income, amount: 800, occurred_on: 2026-09-22, payer: shared, category: null}
    expect:
      rows:
        - {month: 2026-09-01, payer: shared, category: élelmiszer, expense: 500, entry_count: 2}
        - {month: 2026-09-01, payer: shared, category: lakbér, expense: 700, entry_count: 1}

  - name: deposit_history_nullazas
    model: deposit_history
    given:
      - input: ref('deposit_movements')
        rows:
          - {source_id: a, movement: deposit, moved_at: 2026-10-01 10:00:00+00, amount: 150}
          - {source_id: b, movement: voucher, moved_at: 2026-10-02 10:00:00+00, amount: -50}
          - {source_id: c, movement: adjust, moved_at: 2026-10-03 10:00:00+00, amount: 300}
          - {source_id: d, movement: reset, moved_at: 2026-10-04 10:00:00+00, amount: 0}
          - {source_id: e, movement: deposit, moved_at: 2026-10-05 10:00:00+00, amount: 50}
    expect:
      rows:
        - {source_id: a, balance: 150}
        - {source_id: b, balance: 100}
        - {source_id: c, balance: 400}
        - {source_id: d, balance: 0}
        - {source_id: e, balance: 50}

  - name: expected_deposit_mozgas_nelkul
    model: expected_deposit
    given:
      - input: ref('deposit_history')
        format: sql
        rows: |
          select null::bigint as period_no, null::numeric as amount
          where false
    expect:
      rows:
        - {balance: 0}

  - name: expected_deposit_utolso_szakasz
    model: expected_deposit
    given:
      - input: ref('deposit_history')
        rows:
          - {period_no: 0, amount: 500}
          - {period_no: 1, amount: 0}
          - {period_no: 1, amount: 50}
          - {period_no: 1, amount: -300}
    expect:
      rows:
        - {balance: -250}

  - name: deposit_history_azonos_nap
    model: deposit_history
    given:
      - input: ref('deposit_movements')
        rows:
          - {source_id: a, movement: voucher, moved_at: 2026-10-14 00:00:00+00, amount: -300}
          - {source_id: a, movement: deposit, moved_at: 2026-10-14 00:00:00+00, amount: 50}
          - {source_id: a, movement: voucher, moved_at: 2026-10-14 00:00:00+00, amount: -100}
    expect:
      rows:
        - {position: 1, movement: deposit, balance: 50}
        - {position: 2, movement: voucher, balance: -250}
        - {position: 3, movement: voucher, balance: -350}
